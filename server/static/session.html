<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Session detail · Agent OS</title>
  <link rel="icon" href="/static/favicon.svg?v=1" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=169" />
</head>
<body>
  <header class="topbar">
    <nav id="topnav" class="topnav"></nav>
    <span class="spacer"></span>
    <button class="toggle" id="wcAdd" hidden title="Add a watch column">＋ Column</button>
    <button class="toggle" id="wcRemove" hidden title="Remove the right-hand watch column">－ Column</button>
    <button class="toggle danger" id="killAllBtn" title="Shut down every live session (ends all their REPLs)">⏻ Kill All</button>
    <span class="meta" id="meta"></span>
  </header>
  <div class="detail-layout">
    <aside id="attnRail" class="attn-rail" hidden></aside>
    <div id="watchCols" class="watch-cols" hidden></div>
    <main id="detailMain">
      <div id="header"></div>
      <div id="approval"></div>
      <div id="chat" class="chat"></div>
      <div class="hist-bar">
        <h3 class="hist-title">History (newest first)</h3>
        <label class="hist-toggle" title="How many of the latest entries to show.">
          show
          <select id="histLimit">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="all">all</option>
          </select>
        </label>
        <label class="hist-toggle" title="Off = only user & assistant messages (faster). On = also tool calls, results, thinking.">
          <input type="checkbox" id="showAll" /> show tool / thinking
        </label>
      </div>
      <div id="events"></div>
    </main>
  </div>
  <script src="/static/app.js?v=169"></script>
  <script>
    (async function () {
      const q = new URLSearchParams(location.search);
      const fromTodo = q.get("from") === "attention";
      const id = q.get("id");

      // embed=1 — this page is running inside a To-do watch column. Same detail
      // view, same buttons; only the chrome the parent already provides (topbar,
      // rail) is dropped so it doesn't nest.
      if (q.get("embed") === "1") {
        document.body.classList.add("embed");
        Detail.init();
        return;
      }

      renderTopNav(fromTodo ? "todo" : null);

      // To-do view = rail + watch columns. The single-session detail view stays
      // at /session.html?id=<id> (no `from=attention`), which is where a column
      // title and a ⌘/Ctrl-clicked rail item link to.
      if (fromTodo) {
        document.getElementById("detailMain").hidden = true;
        document.getElementById("meta").textContent = "To-do";
        document.getElementById("killAllBtn").addEventListener("click",
          () => killAllTmux(() => AttnRail.tick()));
        // Seed column 1 from ?id= when present, otherwise from the top to-do
        // session, so landing on /To-do always shows something live.
        //
        // Two cases must NOT seed, or the pins you chose get overwritten:
        //   - a reload (⌘R) — it has to come back exactly as you left it, even
        //     though the ?id= that first brought you here is still in the URL;
        //   - arriving with no ?id= while columns are already pinned.
        const nav = performance.getEntriesByType("navigation")[0];
        const isReload = nav
          ? nav.type === "reload"
          : (performance.navigation && performance.navigation.type === 1);
        let seed = isReload ? null : id;
        if (!seed && !isReload && !WatchCols.hasSavedPins()) {
          try {
            const d = await getJSON("/api/triage");
            if (d.sessions && d.sessions.length) seed = d.sessions[0].session_id;
          } catch (e) { /* empty state is fine */ }
        }
        WatchCols.init(seed);
        AttnRail.init();
        return;
      }

      document.getElementById("killAllBtn").addEventListener("click", () => killAllTmux(() => {
        if (id) Detail.load();             // status pill + button states
      }));
      Detail.init();   // no id → Detail shows the missing-id notice
    })();
  </script>
</body>
</html>
